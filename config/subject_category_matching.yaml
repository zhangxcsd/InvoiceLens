# 主体类别 — 机器可执行匹配规则（v1）
# 与 config/subject_category.yaml 的 category_code 对齐；自然语言说明仍以 invoice_scene 为准。
#
# 评估顺序：match_order 自上而下，首个「本组 all（及可选 any）」全部满足即命中并返回。
#
# 顺序设计（重要）：
# 0) 先筛「20 位识别号（任意字符）」→ SC-TEMP：与 18 位统一码/身份证链解耦，避免无规则命中 needs_review。
# 1) 再筛「名称 1～4 字」→ SC-TEMP：自然人姓名常见 2～4 字，公司名通常更长；避免 18 位身份证号
#    与短名称组合被误当作统一社会信用代码去做 91/92 等前缀匹配。
# 2) 基于 18 位码段的规则（含 SC-SELF/92）一律增加「名称长度 ≥4」：在必须用编号匹配时，要求具备
#    最低限度的「公司/组织名称」形态，进一步降低证件号误配风险。
# 3) SC-SELF（92）：与 2) 一致，名称长度 ≥4 才机读命中（短于 4 字的长名个体户不落本规则，可能需人工复核或后续扩展）。
#
# matching_remarks：弱区分说明（机读不解析，供运维/产品对照）。

version: 1
standard_version_ref: GB32100-2015

matching_remarks: |
  20 位识别号（长度即可，字母数字混合亦归入）：按业务约定统一归入 SC-TEMP，与 18 位统一码规则链区分。
  若 20 位为「18 位居民身份证形态 + 2 位数字流水」，属自然人侧编码（主体库 subject_category=person），首条 SC-TEMP 与短名 SC-TEMP 均排除，避免与临时登记主体混淆。
  18 位且末位为数字的全数字串，极少数可能与统一码形态重叠，亦可能与居民身份证号形态接近；当前用 id_card_like（18 位形态，或上述 20 位形态）对 SC-TEMP 做弱分流，其余码段规则要求名称长度 ≥4 以降低证件号误配。
  SC-SELF（92）与上述一致：名称长度 ≥4 才机读命中；名称 1～3 字且 18 位非身份证形态时可能不落 SC-TEMP（any 不成立）也不落 SC-SELF，需结合业务复核或后续规则扩展。

match_order:
  # 20 位识别号（任意字符）→ 临时登记主体（优先于短名称 SC-TEMP 与 18 位统一码链）
  # 排除「身份证 18 + 两位流水」共 20 位：该形态在主体库归为自然人分域，非本处 SC-TEMP。
  - category_code: SC-TEMP
    priority: 4
    all:
      - { kind: id_len, op: eq, value: 20 }
      - { kind: id_card_like, value: false }

  # 短名称优先：自然人/临时场景；但若已是 18 位且明显为统一社会信用代码（非身份证形态），
  # 不拦截，以便落入 92/91 等码段规则（如四字个体工商户名）。
  - category_code: SC-TEMP
    priority: 5
    all:
      - { kind: id_regex, mode: fullmatch, pattern: '^(?!\d{17}[\dX]\d{2}$).*$' }
      - { kind: name_len, op: gte, value: 1 }
      - { kind: name_len, op: lte, value: 4 }
    any:
      - { kind: id_len, op: neq, value: 18 }
      - { kind: id_card_like, value: true }

  - category_code: SC-INSTITUTION
    priority: 20
    all:
      - { kind: name_len, op: gte, value: 4 }
      - { kind: id_len, op: eq, value: 18 }
      - { kind: id_prefix, prefixes: ["1"] }

  - category_code: SC-SOCIAL
    priority: 30
    all:
      - { kind: name_len, op: gte, value: 4 }
      - { kind: id_len, op: eq, value: 18 }
      - { kind: id_prefix, prefixes: ["5"] }

  - category_code: SC-SELF
    priority: 40
    all:
      - { kind: name_len, op: gte, value: 4 }
      - { kind: id_len, op: eq, value: 18 }
      - { kind: id_prefix, prefixes: ["92"] }

  - category_code: SC-COOP
    priority: 50
    all:
      - { kind: name_len, op: gte, value: 4 }
      - { kind: id_len, op: eq, value: 18 }
      - { kind: id_prefix, prefixes: ["93"] }

  # 91：分支机构名称规则必须先于「独立法人默认」
  - category_code: SC-BRANCH
    priority: 60
    all:
      - { kind: name_len, op: gte, value: 4 }
      - { kind: id_len, op: eq, value: 18 }
      - { kind: id_prefix, prefixes: ["91"] }
    any:
      - { kind: name_regex, pattern: "(分公司|分支机构|分店|支行|办事处|营业部|项目部|分厂|分场)$" }
      - { kind: name_regex, pattern: "有限公司.{1,}$" }
      - { kind: name_regex, pattern: "股份有限公司.{1,}$" }

  - category_code: SC-ENT
    priority: 70
    all:
      - { kind: name_len, op: gte, value: 4 }
      - { kind: id_len, op: eq, value: 18 }
      - { kind: id_prefix, prefixes: ["91"] }
