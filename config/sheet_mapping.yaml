# =============================================================================
# Sheet 名 -> 稳定英文 data_type（ODS 分区 `表类型=...`）
# 「键」= 下方映射对象左侧引号内的字面名（导入时对 Excel 工作表名做包含匹配）。
# 「值」= table_type，须与 config/ddl/ods.sql 中 ods_<table_type> 视图路径一致。
#
# 维护原则（请遵守）
# - 后续以本文件为准做扩充；新增 sheet 映射请追加条目。
# - 不要随意删除已有键：历史批次、ODS 目录、manifest 可能仍引用旧 data_type。
# - 新增或调整映射到的 table_type（value）时：请在 config/ddl/ods.sql 增加同名
#   `ods_<table_type>` 的 read_parquet 视图（路径 `表类型=<value>` 须一致），否则 DuckDB 无法挂载该分区。
# - 「信息汇总表」「货物清单」共用 inv_detail：若修改本文件中这两键的 `#` 行内说明，请同步
#   config/ddl/ods.sql 中 ods_inv_detail 视图上方对应摘抄段，避免与 YAML 漂移。
# - 若某类型不再使用：可保留键，将 value 旁用行注释标注 Deprecated，或注明替代 data_type。
#
# 同名族合并（不必为「1」「2」拆类型）：
# - 导入时按「包含匹配」：只要 Excel 工作表名**包含**本文件中某一键（去空格后），即映射到该键对应的 table_type。
# - 例如键「信息汇总表」可同时覆盖工作表「信息汇总表」「信息汇总表1」「信息汇总表2」等，**统一写入同一 ODS 表类型**；
#   不会在数据预览里按 1/2 拆 Tab，也不分别统计张数；行级仍可通过 Parquet 列 source_sheet 追溯原始表名（若需审计）。
# =============================================================================

{
  "发票基础信息": "inv_header", #兼容旧模板/工作簿表名；与「发票基础数据」同一 ODS 类型
  "信息汇总表": "inv_detail", #货物或服务的详细清单，提供更全面的发票数据概览，可能包含红字发票统计
  "货物清单": "inv_detail", #货物或服务的详细清单，提供更全面的发票数据概览。老版本金税系统中会使用，与信息汇总表不会同时出现
  "不动产销售": "spc_estate", #房地产销售类
  "机动车销售": "spc_vehicle", #机动车销售
  "二手车销售": "spc_used_vehicle", #二手车
  "拖拉机": "spc_agri_machinery", #拖拉机和联合收割机，农机购置补贴相关
  "成品油": "spc_oil", #成品油采购与销售
  "稀土": "spc_rare_earth",
  "农产品收购": "spc_agri_acquisition", #农产品收购
  "自产农产品": "spc_agri_self_produced", #自产农产品销售
  "光伏": "spc_pv_acquisition", #光伏收购
  "报废产品收购": "spc_scrap_acquisition", #资源回收行业
  "无形资产": "spc_intangible", #专利、商标、著作权等
  "建筑服务": "spc_construction", #建筑安装工程类
  "金融服务": "spc_finance", #金融保险类
  "现代服务": "spc_modern_service", #研发、信息技术、文化创意等
  "生活服务": "spc_life_service", #餐饮、住宿、旅游等服务
  "医疗服务": "spc_medical", #医疗机构开票专用
  "通行费": "spc_toll", #高速公路等通行费
  "不动产经营租赁": "spc_estate_lease", #房屋租赁类
  "有形动产租赁": "spc_tangible_lease", #设备租赁等
  "货物运输服务": "spc_freight", #货物运输服务类
  "旅客运输服务": "spc_passenger_transport", #出租车、网约车服务
  "铁路电子客票": "spc_rail_eticket",  #2024年11月1日前为“铁路客票”（纸质报销凭证）
  "铁路客票": "spc_rail_ticket",
  "航空运输": "spc_air_transport", #航空运输电子客票、航空运输行程单
  "车船税": "spc_vehicle_vessel_tax", #代收车船税
  "差额征税": "spc_diff_taxation",
  "代开发票": "spc_agency_invoice", #税务机关代开场景
}
