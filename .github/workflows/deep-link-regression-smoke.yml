name: Deep Link Audit Flag Smoke

on:
  push:
    paths:
      - 'frontend/tests/deep-link-audit-flag.spec.ts'
      - 'frontend/tests/nav-walkthrough.spec.ts'
      - 'frontend/src/dm/flagActionHelpers.ts'
      - 'frontend/src/dws/**'
      - 'frontend/src/dim/TaxCodeEnterpriseAnalysisPage.tsx'
      - 'frontend/src/utils/navHelpers.ts'
      - 'frontend/playwright.config.ts'
      - 'frontend/package.json'
      - '.github/workflows/deep-link-regression-smoke.yml'
  pull_request:
    paths:
      - 'frontend/tests/deep-link-audit-flag.spec.ts'
      - 'frontend/tests/nav-walkthrough.spec.ts'
      - 'frontend/src/dm/flagActionHelpers.ts'
      - 'frontend/src/dws/**'
      - 'frontend/src/dim/TaxCodeEnterpriseAnalysisPage.tsx'
      - 'frontend/src/utils/navHelpers.ts'
      - 'frontend/playwright.config.ts'
      - 'frontend/package.json'
      - '.github/workflows/deep-link-regression-smoke.yml'

jobs:
  deep-link-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build frontend for preview
        run: npm run build

      - name: Run deep-link audit flag regression
        run: npm run test:deep-link-audit-flag
