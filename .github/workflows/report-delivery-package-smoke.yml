name: Report Delivery Package Smoke

on:
  push:
    paths:
      - 'src/local_api/report_api.py'
      - 'src/local_api/data_quality.py'
      - 'src/local_api/audit_flag_api.py'
      - 'src/local_api/finance_reconcile_api.py'
      - 'src/local_api/invoice_export_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'src/reporting/reporter.py'
      - 'frontend/src/report/ReportConfigPage.tsx'
      - 'frontend/src/config/localApi.ts'
      - 'frontend/src/copy/zh-CN.ts'
      - 'scripts/test_report_delivery_package_smoke.py'
      - '.github/workflows/report-delivery-package-smoke.yml'
  pull_request:
    paths:
      - 'src/local_api/report_api.py'
      - 'src/local_api/data_quality.py'
      - 'src/local_api/audit_flag_api.py'
      - 'src/local_api/finance_reconcile_api.py'
      - 'src/local_api/invoice_export_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'src/reporting/reporter.py'
      - 'frontend/src/report/ReportConfigPage.tsx'
      - 'frontend/src/config/localApi.ts'
      - 'frontend/src/copy/zh-CN.ts'
      - 'scripts/test_report_delivery_package_smoke.py'
      - '.github/workflows/report-delivery-package-smoke.yml'

jobs:
  report-delivery-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install duckdb python-docx pandas openpyxl pyyaml

      - name: Run delivery package smoke tests
        run: python scripts/test_report_delivery_package_smoke.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
