name: Tree Regression Smoke

on:
  push:
    paths:
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - '.github/workflows/tree-regression-smoke.yml'
  pull_request:
    paths:
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - '.github/workflows/tree-regression-smoke.yml'

jobs:
  tree-regression-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Playwright tree regression
        working-directory: frontend
        run: npx playwright test tests/tree-regression.spec.ts --project=chromium
