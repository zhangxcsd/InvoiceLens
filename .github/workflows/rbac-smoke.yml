name: RBAC Smoke

on:
  push:
    paths:
      - 'src/local_api/auth_session.py'
      - 'src/local_api/users_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'frontend/src/users/rbacNav.ts'
      - 'frontend/src/users/rbacContext.tsx'
      - 'frontend/src/App.tsx'
      - 'frontend/src/config/localApi.ts'
      - 'frontend/tests/rbac-nav.spec.ts'
      - 'frontend/playwright.rbac.config.ts'
      - 'scripts/test_rbac_smoke.py'
      - '.github/workflows/rbac-smoke.yml'
  pull_request:
    paths:
      - 'src/local_api/auth_session.py'
      - 'src/local_api/users_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'frontend/src/users/rbacNav.ts'
      - 'frontend/src/users/rbacContext.tsx'
      - 'frontend/src/App.tsx'
      - 'frontend/src/config/localApi.ts'
      - 'frontend/tests/rbac-nav.spec.ts'
      - 'frontend/playwright.rbac.config.ts'
      - 'scripts/test_rbac_smoke.py'
      - '.github/workflows/rbac-smoke.yml'

jobs:
  rbac-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run RBAC smoke (incl. multipart write paths)
        run: python scripts/test_rbac_smoke.py

  rbac-nav-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for preview
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: RBAC nav Playwright
        working-directory: frontend
        run: npm run test:rbac-nav
