name: import-field-mapping-template-smoke

on:
  push:
    paths:
      - 'config/field_mapping.py'
      - 'src/ingestion/excel_to_ods.py'
      - 'src/local_api/field_mapping_template_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'src/local_api/data_quality.py'
      - 'scripts/test_import_field_mapping_template_smoke.py'
  pull_request:
    paths:
      - 'config/field_mapping.py'
      - 'src/ingestion/excel_to_ods.py'
      - 'src/local_api/field_mapping_template_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'src/local_api/data_quality.py'
      - 'scripts/test_import_field_mapping_template_smoke.py'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run import field mapping template smoke
        run: python scripts/test_import_field_mapping_template_smoke.py
