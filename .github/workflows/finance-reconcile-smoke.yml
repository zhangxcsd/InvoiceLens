name: Finance Reconcile Smoke

on:
  push:
    paths:
      - 'src/local_api/finance_reconcile_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'config/ddl/finance.sql'
      - 'scripts/test_finance_reconcile_api_smoke.py'
      - '.github/workflows/finance-reconcile-smoke.yml'
  pull_request:
    paths:
      - 'src/local_api/finance_reconcile_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'config/ddl/finance.sql'
      - 'scripts/test_finance_reconcile_api_smoke.py'
      - '.github/workflows/finance-reconcile-smoke.yml'

jobs:
  finance-reconcile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install duckdb pandas openpyxl

      - name: Run finance reconcile API smoke tests
        run: python scripts/test_finance_reconcile_api_smoke.py
