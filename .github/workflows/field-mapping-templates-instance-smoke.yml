name: field-mapping-templates-instance-smoke

on:
  push:
    paths:
      - 'src/local_api/field_mapping_template_api.py'
      - 'src/local_api/settings_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'scripts/test_field_mapping_templates_instance_smoke.py'
  pull_request:
    paths:
      - 'src/local_api/field_mapping_template_api.py'
      - 'src/local_api/settings_api.py'
      - 'src/local_api/sheet_mapping_server.py'
      - 'scripts/test_field_mapping_templates_instance_smoke.py'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run field mapping templates + instance config smoke
        run: python scripts/test_field_mapping_templates_instance_smoke.py
