name: Enterprise Year Rel Mutex Smoke

on:
  push:
    paths:
      - 'src/local_api/enterprise_year_rel_build.py'
      - 'src/local_api/dwd_to_dim_build.py'
      - 'scripts/test_enterprise_year_rel_mutex_smoke.py'
      - '.github/workflows/enterprise-year-rel-mutex-smoke.yml'
  pull_request:
    paths:
      - 'src/local_api/enterprise_year_rel_build.py'
      - 'src/local_api/dwd_to_dim_build.py'
      - 'scripts/test_enterprise_year_rel_mutex_smoke.py'
      - '.github/workflows/enterprise-year-rel-mutex-smoke.yml'

jobs:
  enterprise-year-rel-mutex-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run enterprise year rel mutex smoke tests
        run: python scripts/test_enterprise_year_rel_mutex_smoke.py
